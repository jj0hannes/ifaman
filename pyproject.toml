[project]
name = "ifaman"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "johannes", email = "jjifatc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.128.0",
    "pydantic>=2.12.5",
    "pytest>=9.0.2",
    "requests>=2.32.5",
]

[project.scripts]
ifaman = "ifaman:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
